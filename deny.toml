# cargo-deny: licenze, fonti e crate vietati. Le vulnerabilità note (RustSec) le controlla `cargo audit`
# nel workflow CI. Il progetto è AGPL-3.0: sono ammesse le licenze permissive e quelle copyleft
# compatibili; niente licenze con clausole che ne impediscano la ridistribuzione.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "AGPL-3.0-only",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# le dipendenze tra i crate del workspace sono path senza versione (nessun crate è pubblicato)
allow-wildcard-paths = true
# i crate di OpenSSL non servono: TLS è rustls
deny = [{ crate = "openssl" }, { crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
