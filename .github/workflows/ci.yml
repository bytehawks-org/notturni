name: CI

# Qualità del backend Rust a ogni push e pull request: formattazione, lint (clippy con i warning come
# errori), test completi su servizi veri (Postgres, Redis, NATS JetStream, un S3 finto), coerenza dei
# manifest dichiarativi con le migrazioni e il lock, licenze e vulnerabilità delle dipendenze.
# Il workspace vieta `unsafe` (lint `forbid` in Cargo.toml): qui non serve un controllo a parte.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"
  # la CI non ha bisogno dei simboli di debug: binari di test più piccoli, link più rapido
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt-clippy:
    name: Formattazione e clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  manifests:
    name: Manifest, migrazioni e OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOCT_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Valida i manifest (drift di db.toml incluso)
        run: cargo run --locked -q -p noct-ctl -- validate
      - name: Nessuna modifica di schema non migrata
        run: |
          out=$(cargo run --locked -q -p noct-ctl -- migrate plan)
          echo "$out"
          if echo "$out" | grep -qE '^\s+[+~-] '; then
            echo "::error::db.toml è cambiato senza una migrazione: esegui 'noct-ctl migrate generate'"
            exit 1
          fi
      - name: Applica le migrazioni a un database vuoto e verificale
        run: |
          cargo run --locked -q -p noct-ctl -- migrate apply
          cargo run --locked -q -p noct-ctl -- migrate verify
      - name: OpenAPI generabile
        run: cargo run --locked -q -p noct-ctl -- openapi > /dev/null

  helm:
    name: Chart Helm (lint, template, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELM_VERSION: v3.19.0
      # SHA-256 del tarball ufficiale (https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum)
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
    steps:
      - uses: actions/checkout@v5
      - name: Installa helm (versione fissata, checksum verificato)
        run: |
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: helm lint e helm template (solo, platform, full)
        run: |
          for f in helm/notturni/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint helm/notturni -f "$f"
            helm template notturni helm/notturni -f "$f" > /dev/null
            echo "::endgroup::"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test del chart (helm_chart, deploy_configs)
        run: cargo test --locked -p noct-api --test helm_chart --test deploy_configs

  test:
    name: Test (Postgres, Redis, NATS, S3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      moto:
        image: motoserver/moto:latest
        ports: ["5000:5000"]
    env:
      NOCT_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      NOCT_TEST_REDIS_URL: redis://localhost:6379/0
      NOCT_TEST_NATS_URL: nats://localhost:4222
      NOCT_TEST_S3_ENDPOINT: http://localhost:5000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # i service container non accettano argomenti per il comando: JetStream si avvia a mano
      - name: NATS JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2-alpine -js
      # pg_dump serve ai test del backup infrastrutturale (versione >= del server)
      - name: Client PostgreSQL
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: cargo test
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (tsc, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      # build first: it generates the `.next/types` (LayoutProps) that tsc needs
      - name: build
        run: npm run build
      - name: tsc
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: test
        run: npm test

  supply-chain:
    name: Licenze e vulnerabilità (cargo-deny, cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: cargo-deny (licenze, fonti, ban)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: cargo-audit (RustSec)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
