name: Pubblica immagini (GHCR)

# Build multi-arch (amd64+arm64, CLAUDE.md #3: "Dockerfile e manifest
# agnostici rispetto all'architettura" — sviluppo x86_64, produzione ARM64)
# delle tre immagini container del progetto, pubblicate su GitHub Container
# Registry sotto l'organizzazione (ghcr.io/bytehawks-org/notturni-<nome>,
# vedi https://github.com/orgs/bytehawks-org/packages). Autenticazione a
# GHCR con il GITHUB_TOKEN effimero generato automaticamente per la run
# (permesso packages: write sotto), non un Personal Access Token da creare
# a mano.
#
# Ogni architettura gira sul suo runner NATIVO (amd64: ubuntu-latest, arm64:
# ubuntu-24.04-arm), poi un job per immagine unisce i due digest in un unico
# manifest multi-arch. Sotto QEMU la compilazione Rust in release arm64 superava
# le 2 ore; nativa impiega come l'amd64. Le immagini più lente sono "backend"
# (compilazione Rust in release, cache dei layer con cargo-chef) e "moderation"
# (installa torch e scarica un modello ML in fase di build, vedi
# moderation/Dockerfile): ogni immagine e architettura è un job a sé (matrice,
# fail-fast:false). I runner arm64 sono gratuiti per i repository pubblici;
# per quelli privati sono a consumo.
#
# Nota per la prima pubblicazione di ciascuna immagine: un pacchetto GHCR
# creato da un workflow nasce privato di default, anche se il repository è
# pubblico — va reso pubblico (o collegato esplicitamente al repository) a
# mano una volta, da Package settings nella pagina del pacchetto su GitHub.
# Se il push fallisce con 403 al login/push (non a un problema di sintassi):
# controllare in bytehawks-org -> Settings -> Packages che "Package creation"
# per Actions non sia ristretto a livello di organizzazione.
on:
  push:
    branches:
      - main
      - develop
      - migration/rust
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend, moderation]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - name: backend
            context: .
            file: ./Dockerfile
            build-args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            # NEXT_PUBLIC_* è inglobato nel bundle in fase di build, non
            # letto a runtime (vedi frontend/Dockerfile, k8s/README.md): i
            # valori qui sono quelli di produzione, sovrascrivibili senza
            # toccare questo file impostando le repository/organization
            # variable NEXT_PUBLIC_API_URL/NEXT_PUBLIC_SITE_URL (Settings ->
            # Secrets and variables -> Actions -> Variables).
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://notturni.eu' }}
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://notturni.eu' }}
          - name: moderation
            context: ./moderation
            file: ./moderation/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/notturni-${{ matrix.name }}

      # push per digest (senza tag): i tag li applica il job `merge` sul manifest multi-arch
      - name: Build e push (per digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/notturni-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Esporta il digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Salva il digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest multi-arch (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend, moderation]
    steps:
      - name: Scarica i digest
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadati/tag immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/notturni-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # prova su K3s della riscrittura in Rust: il branch di migrazione pubblica anche questo tag fisso
            type=raw,value=0.2.0-rust,enable=${{ github.ref == 'refs/heads/migration/rust' }}

      - name: Crea e pubblica il manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/notturni-${{ matrix.name }}@sha256:%s ' *)

      - name: Verifica
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/notturni-${{ matrix.name }}:${{ steps.meta.outputs.version }}
