name: DAST (OWASP ZAP)

# Analisi dinamica contro lo stack realmente in esecuzione (stesso
# compose.yaml usato in locale, avviato con Docker invece di Podman — nessuna
# sintassi specifica di Podman nel file, vedi CLAUDE.md #3 "Dockerfile e
# manifest agnostici"). Più pesante di SAST/SBOM (build completa + avvio
# stack + scansione): solo schedule settimanale + avvio manuale, mai su ogni
# push/PR. Tre scansioni in sequenza sullo stesso stack già avviato (nessun
# riavvio tra l'una e l'altra): baseline (passivo) e full scan (attivo, prova
# exploit veri) sul frontend, API scan (attivo, dallo schema OpenAPI) sul
# backend. Ogni report finisce sia come artifact scaricabile sia nel
# riepilogo della run (tab "Summary" del workflow), leggibile senza scaricare
# nulla. fail_action/allow_issue_writing restano a false: i risultati sono
# solo informativi, non bloccano la pipeline né aprono issue automatiche.
on:
  workflow_dispatch: {}
  schedule:
    # lunedì 04:23 UTC — cadenza indipendente da codeql.yml/sbom.yml, per non
    # sommare più job pesanti nella stessa finestra.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  zap-scan:
    name: ZAP baseline + full scan (frontend) + API scan (backend)
    runs-on: ubuntu-latest
    # il full scan attivo (spider + tutte le regole attive) è sensibilmente
    # più lento del solo baseline+API scan di prima: margine alzato di
    # conseguenza.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara .env per l'ambiente CI
        # Stessi default di sviluppo di GETTING_STARTED.md #1 (segreti fittizi,
        # mai usati fuori da questo runner effimero) — bastano per avviare lo
        # stack, non serve altro per una scansione black-box.
        run: cp .env.example .env

      - name: Avvia lo stack (Postgres, Redis, RabbitMQ, MinIO, backend, frontend, ...)
        run: docker compose -f compose.yaml up -d --build

      - name: Attendi Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f compose.yaml exec -T postgres pg_isready -U admin && break
            sleep 2
          done

      - name: Applica le migrazioni
        run: docker compose -f compose.yaml exec -T backend alembic upgrade head

      - name: Attendi backend e frontend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

      - name: ZAP baseline scan (pagine pubbliche del frontend)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Riepilogo baseline scan nella run
        # Il report completo resta nell'artifact caricato dallo step sopra;
        # questo lo affianca nel riepilogo della run (tab "Summary"), visibile
        # senza scaricare nulla. report_md.md è il nome fisso con cui
        # zaproxy/action-baseline scrive il report Markdown nella working
        # directory — va letto subito dopo quello step, prima che il
        # prossimo scan lo sovrascriva.
        if: always()
        run: |
          { echo "## DAST — ZAP baseline scan (frontend)"; cat report_md.md 2>/dev/null || echo "_report non generato._"; } >> "$GITHUB_STEP_SUMMARY"

      - name: ZAP API scan (backend, da OpenAPI)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: "http://localhost:8000/openapi.json"
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api-report

      - name: Riepilogo API scan nella run
        if: always()
        run: |
          { echo "## DAST — ZAP API scan (backend)"; cat report_md.md 2>/dev/null || echo "_report non generato._"; } >> "$GITHUB_STEP_SUMMARY"

      - name: ZAP full scan (scan attivo del frontend — spider + tutte le regole attive)
        # A differenza del baseline (solo passivo), qui ZAP tenta attivamente
        # exploit (SQLi, XSS, ecc.) contro il target — sicuro solo perché
        # punta allo stack effimero avviato sopra in questo runner, mai a
        # un'istanza reale: non puntare mai questo scan a notturni.eu.
        # Più lento del baseline, per questo resta nello stesso job invece
        # che duplicare l'avvio dello stack in un job a parte.
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:3000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-full-scan-report

      - name: Riepilogo full scan nella run
        if: always()
        run: |
          { echo "## DAST — ZAP full scan attivo (frontend)"; cat report_md.md 2>/dev/null || echo "_report non generato._"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Log dei servizi (solo in caso di problemi)
        if: failure()
        run: docker compose -f compose.yaml logs --tail=200

      - name: Ferma lo stack
        if: always()
        run: docker compose -f compose.yaml down -v
