name: SBOM

# Software Bill of Materials, formato CycloneDX: un inventario delle
# dipendenze, non un'analisi di vulnerabilità (per quello vedi SAST/DAST negli
# altri due workflow). Due livelli distinti:
#   - "sorgenti": da requirements.txt/package-lock.json, un file per
#     sotto-progetto (backend, frontend, moderation) — veloce, sempre eseguito.
#   - "immagini": dal contenuto reale delle immagini container backend/
#     frontend effettivamente costruite — più preciso (include anche
#     dipendenze di sistema installate nel Dockerfile), ma più lento.
#     "moderation" (immagine pesante, dipendenze ML torch/transformers) è
#     escluso da questo livello: la SBOM sorgenti la copre comunque.
# Ogni SBOM è un artifact scaricabile del workflow run (retention 180 giorni)
# più un conteggio componenti nel riepilogo della run (tab "Summary"),
# leggibile senza scaricare nulla — solo per farsi un'idea delle dimensioni,
# il dettaglio completo resta nel file CycloneDX.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sbom-sorgenti:
    name: SBOM sorgenti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SBOM backend (Python)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.cyclonedx.json
          upload-artifact: false

      - name: SBOM frontend (Node)
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cyclonedx.json
          upload-artifact: false

      - name: SBOM moderation (Python)
        uses: anchore/sbom-action@v0
        with:
          path: ./moderation
          format: cyclonedx-json
          output-file: sbom-moderation.cyclonedx.json
          upload-artifact: false

      - name: Carica i report SBOM sorgenti
        uses: actions/upload-artifact@v4
        with:
          name: sbom-sorgenti
          path: |
            sbom-backend.cyclonedx.json
            sbom-frontend.cyclonedx.json
            sbom-moderation.cyclonedx.json
          # 180 giorni invece dei 90 di default: la SBOM sorgenti resta
          # comunque un artifact del workflow run (non un asset persistente
          # come una release), ma così sopravvive più a lungo tra due
          # scansioni di sicurezza fatte a distanza di mesi.
          retention-days: 180

      - name: Riepilogo componenti nella run
        # Conteggio componenti per sotto-progetto nel riepilogo della run
        # (tab "Summary"), visibile senza scaricare gli artifact.
        if: always()
        run: |
          {
            echo "## SBOM sorgenti — componenti rilevati"
            echo "| Sotto-progetto | Componenti |"
            echo "|---|---|"
            echo "| backend | $(jq '.components | length' sbom-backend.cyclonedx.json 2>/dev/null || echo "n/d") |"
            echo "| frontend | $(jq '.components | length' sbom-frontend.cyclonedx.json 2>/dev/null || echo "n/d") |"
            echo "| moderation | $(jq '.components | length' sbom-moderation.cyclonedx.json 2>/dev/null || echo "n/d") |"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom-immagini:
    name: SBOM immagini container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build immagine backend
        run: docker build -t notturni-backend:ci ./backend

      - name: Build immagine frontend
        run: docker build -t notturni-frontend:ci ./frontend

      - name: SBOM immagine backend
        uses: anchore/sbom-action@v0
        with:
          image: notturni-backend:ci
          format: cyclonedx-json
          output-file: sbom-image-backend.cyclonedx.json
          upload-artifact: false

      - name: SBOM immagine frontend
        uses: anchore/sbom-action@v0
        with:
          image: notturni-frontend:ci
          format: cyclonedx-json
          output-file: sbom-image-frontend.cyclonedx.json
          upload-artifact: false

      - name: Carica i report SBOM immagini
        uses: actions/upload-artifact@v4
        with:
          name: sbom-immagini
          path: |
            sbom-image-backend.cyclonedx.json
            sbom-image-frontend.cyclonedx.json
          retention-days: 180

      - name: Riepilogo componenti nella run
        if: always()
        run: |
          {
            echo "## SBOM immagini container — componenti rilevati"
            echo "| Immagine | Componenti |"
            echo "|---|---|"
            echo "| backend | $(jq '.components | length' sbom-image-backend.cyclonedx.json 2>/dev/null || echo "n/d") |"
            echo "| frontend | $(jq '.components | length' sbom-image-frontend.cyclonedx.json 2>/dev/null || echo "n/d") |"
          } >> "$GITHUB_STEP_SUMMARY"
