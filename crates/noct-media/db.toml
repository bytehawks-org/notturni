# Una riga per ogni immagine caricata (o importata dai post con `POST /blogs/{slug}/media/sync`).
[[table]]
name = "media_files"
timestamps = true
columns = [
  { name = "id", type = "uuid", pk = true, default = "gen_random_uuid()" },
  { name = "blog_id", type = "uuid", ref = "blogs.id", on_delete = "cascade" },
  { name = "uploader_id", type = "uuid", null = true, ref = "users.id", on_delete = "set_null" },
  # chiave nel bucket dei contenuti; null per le righe importate dai post
  { name = "object_key", type = "varchar(512)", null = true },
  { name = "url", type = "text" },
  { name = "content_type", type = "varchar(100)", default = "''" },
  { name = "size_bytes", type = "bigint", default = "0" },
  { name = "alt_text", type = "text", default = "''" },
  { name = "caption", type = "text", null = true },
  # categorie di avviso scelte dall'autore
  { name = "categories", type = "text[]", default = "'{}'" },
  # esito della moderazione automatica all'upload
  { name = "is_sensitive", type = "boolean", default = "false" },
]
uniques = [{ name = "uq_media_files_url", columns = ["url"] }]
indexes = [{ columns = ["blog_id"] }]
