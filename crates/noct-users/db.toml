[[enum]]
name = "platform_role"
values = ["super_admin", "amministratore", "moderatore", "utente"]

# Come l'utente firma i propri testi, in mancanza di un alias di membership o di blog
# (il valore `verified_domain` arriva con il modulo dei domini verificati).
[[enum]]
name = "post_author_name_style"
values = ["username", "full_name", "display_name"]

[[table]]
name = "users"
timestamps = true
columns = [
  { name = "id", type = "uuid", pk = true, default = "gen_random_uuid()" },
  { name = "username", type = "varchar(32)" },
  { name = "email", type = "varchar(255)" },
  { name = "platform_role", type = "enum:platform_role", default = "'utente'" },
  { name = "is_active", type = "boolean", default = "true" },
  # nullable: un utente creato solo via SSO non ha una password locale
  { name = "hashed_password", type = "varchar(255)", null = true },
  # i JWT emessi prima di questo istante non sono più validi (cambio/reset password)
  { name = "credentials_changed_at", type = "timestamptz", null = true },
  # flag riservato: lo imposta il modulo auth-mfa quando l'utente attiva l'MFA
  { name = "mfa_enabled", type = "boolean", default = "false" },
  { name = "display_name", type = "varchar(255)", null = true },
  { name = "ui_locale", type = "varchar(2)", null = true },
  { name = "first_name", type = "varchar(100)", null = true },
  { name = "last_name", type = "varchar(100)", null = true },
  # chiave nel bucket pubblico degli avatar; l'URL si risolve a runtime
  { name = "avatar_object_key", type = "varchar(255)", null = true },
  { name = "post_author_name_style", type = "enum:post_author_name_style", default = "'username'" },
]
uniques = [
  { name = "uq_users_username", columns = ["username"] },
  { name = "uq_users_email", columns = ["email"] },
]
