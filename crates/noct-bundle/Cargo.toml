[package]
name = "noct-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["taxonomy", "publications", "pages", "link-preview", "notes", "fragments", "comments", "discovery", "interests", "auth-mfa", "auth-sso", "reports", "newsletter", "custom-domains", "gdpr", "image-moderation"]
taxonomy = ["dep:noct-taxonomy"]
publications = ["dep:noct-publications"]
pages = ["dep:noct-pages"]
link-preview = ["dep:noct-link-preview"]
notes = ["dep:noct-notes"]
fragments = ["dep:noct-fragments"]
comments = ["dep:noct-comments"]
discovery = ["dep:noct-discovery"]
interests = ["dep:noct-interests"]
auth-mfa = ["dep:noct-auth-mfa"]
auth-sso = ["dep:noct-auth-sso"]
reports = ["dep:noct-reports"]
newsletter = ["dep:noct-newsletter"]
custom-domains = ["dep:noct-custom-domains"]
gdpr = ["dep:noct-gdpr"]
image-moderation = ["dep:noct-image-moderation"]
sandbox = ["dep:noct-sandbox"]

[lints]
workspace = true

[dependencies]
noct-core.workspace = true
noct-users.workspace = true
noct-profiles.workspace = true
noct-platform.workspace = true
noct-blogs.workspace = true
noct-posts.workspace = true
noct-media.workspace = true
noct-events.workspace = true
noct-audit.workspace = true
noct-auth.workspace = true
noct-taxonomy = { workspace = true, optional = true }
noct-publications = { workspace = true, optional = true }
noct-pages = { workspace = true, optional = true }
noct-link-preview = { workspace = true, optional = true }
noct-notes = { workspace = true, optional = true }
noct-fragments = { workspace = true, optional = true }
noct-comments = { workspace = true, optional = true }
noct-discovery = { workspace = true, optional = true }
noct-interests = { workspace = true, optional = true }
noct-reports = { workspace = true, optional = true }
noct-newsletter = { workspace = true, optional = true }
noct-custom-domains = { workspace = true, optional = true }
noct-gdpr = { workspace = true, optional = true }
noct-image-moderation = { workspace = true, optional = true }
noct-auth-mfa = { workspace = true, optional = true }
noct-auth-sso = { workspace = true, optional = true }
noct-sandbox = { workspace = true, optional = true }
