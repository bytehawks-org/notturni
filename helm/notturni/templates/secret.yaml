{{- /* Chart-managed Secret, created only without secrets.existingSecret. Mandatory keys are generated on first
       install and preserved on upgrade with `lookup`. Values are never printed by NOTES.txt. */ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "notturni.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if and $existing $existing.data -}}{{- $old = $existing.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "notturni.labels" . | nindent 4 }}
type: Opaque
data:
  NOCT_POSTGRES_PASSWORD: {{ include "notturni.keep" (list $old "NOCT_POSTGRES_PASSWORD" (randAlphaNum 32)) }}
  NOCT_JWT_SECRET: {{ include "notturni.keep" (list $old "NOCT_JWT_SECRET" (randAlphaNum 64)) }}
  NOCT_REVALIDATE_SECRET: {{ include "notturni.keep" (list $old "NOCT_REVALIDATE_SECRET" (randAlphaNum 32)) }}
  {{- if .Values.admin.email }}
  NOCT_SUPER_ADMIN_PASSWORD: {{ include "notturni.keep" (list $old "NOCT_SUPER_ADMIN_PASSWORD" (randAlphaNum 24)) }}
  {{- end }}
  {{- if include "notturni.garage" . }}
  {{- /* Garage formats: key id "GK" + 24 hex, secrets 64 hex */}}
  NOCT_S3_ACCESS_KEY_ID: {{ include "notturni.keep" (list $old "NOCT_S3_ACCESS_KEY_ID" (printf "GK%s" (randAlphaNum 40 | sha256sum | trunc 24))) }}
  NOCT_S3_SECRET_ACCESS_KEY: {{ include "notturni.keep" (list $old "NOCT_S3_SECRET_ACCESS_KEY" (randAlphaNum 64 | sha256sum)) }}
  NOCT_GARAGE_RPC_SECRET: {{ include "notturni.keep" (list $old "NOCT_GARAGE_RPC_SECRET" (randAlphaNum 64 | sha256sum)) }}
  NOCT_GARAGE_ADMIN_TOKEN: {{ include "notturni.keep" (list $old "NOCT_GARAGE_ADMIN_TOKEN" (randAlphaNum 48)) }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | b64enc }}
  {{- end }}
{{- end }}
