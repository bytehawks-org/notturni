{{- if .Values.redis.enabled }}
{{- $name := include "notturni.cname" (list . "redis") }}
{{- /* No persistence: Redis only holds rate limiting and distributed locks. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "notturni.componentLabels" (list . "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "notturni.componentSelector" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notturni.componentLabels" (list . "redis") | nindent 8 }}
    spec:
      {{- include "notturni.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "notturni.image" (list . .Values.image.redis) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "notturni.componentLabels" (list . "redis") | nindent 4 }}
spec:
  selector:
    {{- include "notturni.componentSelector" (list . "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
