{{- if .Values.smtp.relay.enabled }}
{{- $name := include "notturni.cname" (list . "smtp-relay") }}
{{- $cfg := include "notturni.cname" (list . "config") }}
{{- $secret := include "notturni.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "notturni.componentLabels" (list . "smtp-relay") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "notturni.componentSelector" (list . "smtp-relay") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notturni.componentLabels" (list . "smtp-relay") | nindent 8 }}
    spec:
      {{- include "notturni.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: smtp-relay
          image: {{ include "notturni.image" (list . .Values.image.smtpRelay) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ALLOWED_SENDER_DOMAINS
              valueFrom: {configMapKeyRef: {name: {{ $cfg }}, key: NOCT_INSTANCE_FQDN}}
            - name: RELAYHOST
              valueFrom: {configMapKeyRef: {name: {{ $cfg }}, key: NOCT_SMTP_RELAY_HOST}}
            - name: RELAYHOST_USERNAME
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: NOCT_SMTP_RELAY_USERNAME, optional: true}}
            - name: RELAYHOST_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: NOCT_SMTP_RELAY_PASSWORD, optional: true}}
          ports:
            # only the submission port (587), not 25
            - containerPort: 587
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "notturni.componentLabels" (list . "smtp-relay") | nindent 4 }}
spec:
  selector:
    {{- include "notturni.componentSelector" (list . "smtp-relay") | nindent 4 }}
  ports:
    - port: 587
      targetPort: 587
{{- end }}
