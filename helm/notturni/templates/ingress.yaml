{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host }}
{{- $mw := printf "%s-%s@kubernetescrd" .Release.Namespace (include "notturni.cname" (list . "security-headers")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "notturni.fullname" . }}
  labels:
    {{- include "notturni.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.traefik.securityHeaders }}
  annotations:
    {{- if .Values.ingress.traefik.securityHeaders }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ include "notturni.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "notturni.cname" (list . "backend") }}
                port:
                  number: 8000
          {{- if include "notturni.isLocal" . }}
          # objects of the local storage are served by the backend (public buckets only)
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: {{ include "notturni.cname" (list . "backend") }}
                port:
                  number: 8000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "notturni.cname" (list . "frontend") }}
                port:
                  number: 3000
{{- if .Values.ingress.traefik.securityHeaders }}
---
# HSTS, nosniff, frame options. The CSP is generated per request by the frontend (nonce).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "notturni.cname" (list . "security-headers") }}
  labels:
    {{- include "notturni.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    customFrameOptionsValue: "DENY"
    referrerPolicy: "strict-origin-when-cross-origin"
{{- end }}
{{- end }}
