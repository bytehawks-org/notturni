{{- if .Values.ingress.enabled }}
{{- $mw := include "notturni.cname" (list . "security-headers") }}
{{- if .Values.subdomains.enabled }}
# Wildcard route for per-blog subdomains (slug.<host> -> frontend). Reserved labels are filtered by the
# frontend (proxy.ts); Traefik uses RE2, which has no negative lookahead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "notturni.cname" (list . "blog-subdomains") }}
  labels:
    {{- include "notturni.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ ternary "websecure" "web" .Values.ingress.tls.enabled }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ include "notturni.tlsSecretName" . }}
  {{- end }}
  routes:
    - kind: Rule
      match: '{{ printf "HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\\.%s$`)" (.Values.ingress.host | replace "." "\\.") }}'
      {{- if .Values.ingress.traefik.securityHeaders }}
      middlewares:
        - name: {{ $mw }}
      {{- end }}
      services:
        - name: {{ include "notturni.cname" (list . "frontend") }}
          port: 3000
{{- end }}
{{- if include "notturni.garage" . }}
---
# Public read proxy of the object storage (s3-public) on its own host; never the S3 API or the Garage admin API.
# Higher priority than the wildcard: an exact host wins over the generic regex.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "notturni.cname" (list . "s3") }}
  labels:
    {{- include "notturni.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ ternary "websecure" "web" .Values.ingress.tls.enabled }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ include "notturni.tlsSecretName" . }}
  {{- end }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" (include "notturni.s3Host" .) | quote }}
      priority: 100
      services:
        - name: {{ include "notturni.cname" (list . "s3-public") }}
          port: 8080
{{- end }}
{{- end }}
