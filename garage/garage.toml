# Garage (S3-compatible object storage, https://garagehq.deuxfleurs.fr) in
# configurazione single-node. Segreti NON in questo file: arrivano da
# variabili d'ambiente GARAGE_RPC_SECRET e GARAGE_ADMIN_TOKEN (compose.yaml /
# k8s/garage.yaml). Layout, chiave applicativa e bucket vengono creati da
# `noct-ctl garage-bootstrap`.
#
# Copia identica in k8s/garage.toml (kustomize non può leggere file fuori
# dalla propria directory): tenere allineate — `cargo test -p noct-api --test deploy_configs`
# lo verifica.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# nodo singolo: nessuna replica. Passando a più nodi va aumentato (e il layout
# riassegnato) — non si può cambiare a posteriori senza migrare i dati.
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# deve coincidere con NOCT_S3_REGION: Garage rifiuta firme SigV4 con altra regione
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[s3_web]
# web endpoint per le letture pubbliche dei bucket con website access attivo
# (raggiunto solo dal proxy s3-public, mai esposto direttamente)
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage.internal"

[admin]
api_bind_addr = "0.0.0.0:3903"
