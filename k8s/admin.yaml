# image: come per backend.yaml/frontend.yaml, sostituire con il riferimento
# al registro reale. Pannello di amministrazione: app Next.js separata da
# frontend/ (vedi frontend/admin/), non una route della stessa app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: notturni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: notturni-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet: {path: /, port: 3001}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: notturni
spec:
  selector:
    app: admin
  ports:
    - port: 3001
      targetPort: 3001
