# Bus di messaggi (NATS con JetStream): eventi e job dei moduli, con consegna garantita, ritentativi e
# dead letter. Un solo nodo come postgres.yaml; i messaggi non ancora consegnati stanno su disco
# (volume dedicato), quelli già pubblicati nell'outbox transazionale del database sopravvivono comunque
# a una perdita del volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: notturni
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: notturni
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:2-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8222}
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-data
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: notturni
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
