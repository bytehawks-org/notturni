apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: notturni
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: notturni
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: notturni-config, key: NOCT_POSTGRES_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: notturni-config, key: NOCT_POSTGRES_DB}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: notturni-secrets, key: NOCT_POSTGRES_PASSWORD}
            # Sottodirectory dedicata invece della radice del mount: un volume
            # Longhorn (ext4) arriva con un lost+found creato dal filesystem,
            # e initdb si rifiuta di inizializzare una data directory non
            # vuota — fallirebbe al primo avvio senza questo.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: notturni
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
