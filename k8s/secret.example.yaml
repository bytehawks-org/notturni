# Copiare in secret.yaml (ignorato da git, vedi .gitignore) e sostituire i valori
# reali prima di applicare. Non committare mai secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: notturni-secrets
  namespace: notturni
type: Opaque
stringData:
  NOCT_POSTGRES_PASSWORD: "foo"
  NOCT_RABBITMQ_PASSWORD: "foo"
  NOCT_S3_SECRET_ACCESS_KEY: "foobarfoobar"

  # generare con: python -c "import secrets; print(secrets.token_urlsafe(48))"
  NOCT_JWT_SECRET: "foo"
  NOCT_SESSION_SECRET: "foo"
  # secret condiviso backend<->frontend per la route /api/revalidate
  # (invalidazione cache). Lasciare vuoto per disattivare la funzione.
  NOCT_REVALIDATE_SECRET: "foo"

  # Bootstrap del primo Super Admin (creato all'avvio del backend se non
  # esiste già — vedi app/domain/auth.py::bootstrap_super_admin). Lasciare
  # una delle tre vuota per disattivarlo.
  NOCT_SUPER_ADMIN_USERNAME: "superadmin"
  NOCT_SUPER_ADMIN_EMAIL: "admin@notturni.eu"
  NOCT_SUPER_ADMIN_PASSWORD: "foo"

  # Backup infrastrutturale su S3 esterno (app/workers/backup.py). Bucket/
  # endpoint/regione in configmap.yaml (non sensibili); qui solo le
  # credenziali. Vuoto: il job resta inattivo.
  NOCT_BACKUP_S3_ACCESS_KEY_ID: ""
  NOCT_BACKUP_S3_SECRET_ACCESS_KEY: ""

  # SMTP per l'invio del codice MFA via email (app/core/mail.py). Host/porta/
  # mittente/TLS in configmap.yaml (non sensibili); qui solo le credenziali.
  # Vuoto: l'OTP resta solo loggato dal consumer, non deve essere il caso in
  # produzione.
  NOCT_SMTP_USER: ""
  NOCT_SMTP_PASSWORD: ""

  # Credenziali dello smarthost esterno per il servizio SMTP containerizzato
  # smtp-relay.yaml (RELAYHOST in configmap.yaml: NOCT_SMTP_RELAY_HOST) —
  # vuote se quel servizio spedisce direttamente invece di inoltrare.
  NOCT_SMTP_RELAY_USERNAME: ""
  NOCT_SMTP_RELAY_PASSWORD: ""

  # SSO: lasciare vuoti i provider non abilitati
  NOCT_OAUTH_GOOGLE_CLIENT_ID: ""
  NOCT_OAUTH_GOOGLE_CLIENT_SECRET: ""
  NOCT_OAUTH_MICROSOFT_CLIENT_ID: ""
  NOCT_OAUTH_MICROSOFT_CLIENT_SECRET: ""
  NOCT_OAUTH_GITHUB_CLIENT_ID: ""
  NOCT_OAUTH_GITHUB_CLIENT_SECRET: ""
  NOCT_OAUTH_LINKEDIN_CLIENT_ID: ""
  NOCT_OAUTH_LINKEDIN_CLIENT_SECRET: ""

  # Cloudflare Turnstile: secret key (mai esposta, a differenza della site
  # key in configmap.yaml). Vuota: i commenti aperti a tutti restano
  # disattivati.
  NOCT_TURNSTILE_SECRET_KEY: ""
