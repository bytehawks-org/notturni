apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Necessario perché kustomize riscriva i riferimenti ai nomi delle ConfigMap
# generate (suffisso hash): i manifest dichiarano `namespace: notturni` ma le
# ConfigMap generate no, e senza questo i volumi continuerebbero a puntare al
# nome senza hash (inesistente).
namespace: notturni

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - nats.yaml
  - garage.yaml
  - s3-public.yaml
  #- smtp-relay.yaml
  - backend.yaml
  - worker.yaml
  - moderation.yaml
  - frontend.yaml
  - cert-manager-issuer.yaml
  - certificate.yaml
  - ingress.yaml
  - middleware-security-headers.yaml
  - ingressroute.yaml
  - ingressroute-s3.yaml
  - networkpolicy.yaml

# Config di Garage e del proxy di lettura pubblica come ConfigMap generate dai
# file di questa directory (il suffisso hash nel nome fa ripartire i pod al
# cambio di contenuto). Copie di ../garage/garage.toml e
# ../s3-public/default.conf.template (kustomize non legge fuori da questa
# directory): tenere allineate (`cargo test -p noct-api --test deploy_configs` lo verifica).
configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
  - name: s3-public-config
    files:
      - default.conf.template=s3-public.conf.template

# Tag delle immagini in un solo posto invece che in ogni singolo manifest:
# kustomize sostituisce il tag di *ogni* image: che referenzia quel nome
# esatto (ripetuto identico in più file — es. "notturni-backend" compare in
# backend.yaml e worker.yaml) su tutta la Kustomization. Al
# prossimo rilascio basta cambiare i tre newTag qui sotto, non toccare i
# singoli manifest. Il tag nei manifest stessi resta comunque un riferimento
# valido (l'ultimo pubblicato) per chi li applica senza passare da kustomize.
images:
  - name: ghcr.io/bytehawks-org/notturni-backend
    newTag: sha-fd6ce11
  - name: ghcr.io/bytehawks-org/notturni-frontend
    newTag: sha-fd6ce11
  - name: ghcr.io/bytehawks-org/notturni-moderation
    newTag: sha-fd6ce11
