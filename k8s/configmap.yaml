apiVersion: v1
kind: ConfigMap
metadata:
  name: notturni-config
  namespace: notturni
data:
  NOCT_APP_ENV: "production"

  # nomi dei servizi Kubernetes: risolvibili via DNS interno del cluster
  NOCT_POSTGRES_HOST: "postgres"
  NOCT_POSTGRES_PORT: "5432"
  NOCT_POSTGRES_USER: "admin"
  NOCT_POSTGRES_DB: "notturni"

  NOCT_RABBITMQ_USER: "admin"
  NOCT_RABBITMQ_HOST: "rabbitmq"
  NOCT_RABBITMQ_PORT: "5672"

  # backend di storage: "s3" (default, questi manifest deployano MinIO come
  # implementazione — vedi minio.yaml) oppure "localstorage" (filesystem
  # locale, non cablato in questi manifest: richiede un volume dedicato per
  # il backend e non è pensato per repliche multiple)
  NOCT_STORAGE_BACKEND: "s3"
  NOCT_S3_ACCESS_KEY_ID: "admin"
  # endpoint interno al cluster, usato dal backend per le chiamate S3
  NOCT_S3_ENDPOINT_URL: "http://minio:9000"
  # placeholder: MinIO non è ancora esposto pubblicamente da questi manifest
  # (nessuna regola Ingress dedicata) — da sostituire con un dominio/CDN reale
  # prima che gli avatar siano visibili dall'esterno del cluster
  NOCT_S3_PUBLIC_URL: "https://storage.notturni.eu"
  NOCT_S3_BUCKET_AVATARS: "avatars"
  # bucket privato per gli archivi di audit (mai esposto pubblicamente)
  NOCT_S3_BUCKET_AUDIT: "notturni-audit"

  # SSO: valorizzare (qui o in secret.yaml) solo i provider da abilitare
  NOCT_OAUTH_REDIRECT_BASE_URL: "https://notturni.eu"

  # placeholder: CORS ad origine esatta non copre i sottodomini per-blog
  # (nomeutente.notturni.eu) — da rivedere con un match a wildcard quando le
  # pagine pubbliche dei blog chiameranno l'API dal browser.
  NOCT_CORS_ORIGINS: "https://notturni.eu"

  # URL interno al cluster del backend, usato dai Server Component del
  # frontend per l'SSR (il browser usa invece l'host pubblico).
  NOCT_BACKEND_INTERNAL_URL: "http://backend:8000"
  # invalidazione on-demand della cache del frontend dopo publish/update di
  # contenuti pubblici (vedi backend/app/core/revalidation.py). Il secret
  # corrispondente è in secret.yaml (NOCT_REVALIDATE_SECRET), condiviso tra
  # backend e frontend; se assente la funzione è disattivata (solo cache a tempo).
  NOCT_FRONTEND_REVALIDATE_URL: "http://frontend:3000/api/revalidate"
