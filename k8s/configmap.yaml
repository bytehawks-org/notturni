apiVersion: v1
kind: ConfigMap
metadata:
  name: notturni-config
  namespace: notturni
data:
  NOCT_APP_ENV: "production"
  # placeholder: sostituire con il dominio reale prima del deploy — usato
  # anche da smtp-relay.yaml come dominio mittenti consentito.
  NOCT_INSTANCE_FQDN: "notturni.eu"
  NOCT_SITE_SLUG: "notturni"

  # nomi dei servizi Kubernetes: risolvibili via DNS interno del cluster
  NOCT_POSTGRES_HOST: "postgres"
  NOCT_POSTGRES_PORT: "5432"
  NOCT_POSTGRES_USER: "admin"
  NOCT_POSTGRES_DB: "notturni"

  NOCT_RABBITMQ_USER: "admin"
  NOCT_RABBITMQ_HOST: "rabbitmq"
  NOCT_RABBITMQ_PORT: "5672"

  NOCT_REDIS_HOST: "redis"
  NOCT_REDIS_PORT: "6379"

  # backend di storage: "s3" (default, questi manifest deployano MinIO come
  # implementazione — vedi minio.yaml) oppure "localstorage" (filesystem
  # locale, non cablato in questi manifest: richiede un volume dedicato per
  # il backend e non è pensato per repliche multiple)
  NOCT_STORAGE_BACKEND: "s3"
  NOCT_S3_ACCESS_KEY_ID: "admin"
  # endpoint interno al cluster, usato dal backend per le chiamate S3
  NOCT_S3_ENDPOINT_URL: "http://minio:9000"
  # placeholder: MinIO non è ancora esposto pubblicamente da questi manifest
  # (nessuna regola Ingress dedicata) — da sostituire con un dominio/CDN reale
  # prima che gli avatar siano visibili dall'esterno del cluster
  NOCT_S3_PUBLIC_URL: "https://storage.notturni.eu"
  NOCT_S3_BUCKET_AVATARS: "avatars"
  # bucket privato per gli archivi di audit (mai esposto pubblicamente)
  NOCT_S3_BUCKET_AUDIT: "notturni-audit"

  # Backup infrastrutturale di Postgres e MinIO (app/workers/backup.py,
  # backup-cronjob.yaml) verso uno storage S3 **esterno** — placeholder,
  # da sostituire con un provider realmente esterno e separato da quello dei
  # contenuti prima della produzione (credenziali in secret.yaml:
  # NOCT_BACKUP_S3_ACCESS_KEY_ID/_SECRET_ACCESS_KEY). Vuoto: il job resta
  # inattivo.
  NOCT_BACKUP_S3_BUCKET: ""
  NOCT_BACKUP_S3_ENDPOINT_URL: ""
  NOCT_BACKUP_S3_REGION: ""

  # SMTP per l'invio del codice MFA via email (app/core/mail.py) — placeholder,
  # da sostituire con un provider SMTP/transazionale reale prima della
  # produzione (credenziali in secret.yaml: NOCT_SMTP_USER/_PASSWORD).
  NOCT_SMTP_HOST: ""
  NOCT_SMTP_PORT: "587"
  NOCT_SMTP_USE_TLS: "true"
  NOCT_SMTP_FROM_EMAIL: "no-reply@notturni.eu"

  # Servizio SMTP containerizzato alternativo (smtp-relay.yaml) — un'opzione
  # in più oltre a puntare NOCT_SMTP_HOST/_PORT/_USE_TLS sopra direttamente a
  # un provider esterno. Per usarlo come invio reale: NOCT_SMTP_HOST=
  # "smtp-relay", NOCT_SMTP_PORT="587", NOCT_SMTP_USE_TLS="false" (rete
  # interna al cluster). RELAY_HOST vuoto: il container spedisce
  # direttamente; valorizzato: inoltra verso quello smarthost (credenziali
  # in secret.yaml: NOCT_SMTP_RELAY_USERNAME/_PASSWORD).
  NOCT_SMTP_RELAY_HOST: ""

  # SSO: valorizzare (qui o in secret.yaml) solo i provider da abilitare.
  # ATTENZIONE: "https://notturni.eu" è il valore di produzione (dominio
  # reale + TLS). Per un test senza dominio (vedi ingress.yaml, versione
  # attuale solo http) sostituirlo con l'indirizzo davvero raggiungibile
  # stasera, es. "http://<ip-nodo>" — senza SSO configurato in secret.yaml
  # questo valore resta comunque inerte (nessun provider chiamato).
  NOCT_OAUTH_REDIRECT_BASE_URL: "https://notturni.eu"

  # Cloudflare Turnstile (app/core/captcha.py): captcha per i commenti aperti
  # a tutti. Site key pubblica (safe da esporre, letta anche dal frontend via
  # GET /api/v1/config) — la secret key sta in secret.yaml. Vuota: quella
  # modalità di commenti non è selezionabile su questa istanza.
  NOCT_TURNSTILE_SITE_KEY: ""

  # placeholder: CORS ad origine esatta non copre i sottodomini per-blog
  # (nomeutente.notturni.eu) — da rivedere con un match a wildcard quando le
  # pagine pubbliche dei blog chiameranno l'API dal browser.
  # ATTENZIONE per il test di stasera: senza dominio reale (ingress.yaml solo
  # http) il browser chiama l'API da "http://<ip-nodo>" — questa variabile
  # va aggiornata di conseguenza, altrimenti ogni richiesta del frontend
  # all'API viene bloccata dal browser come cross-origin non ammessa (nessun
  # errore lato backend: si vede solo in console/Network del browser).
  NOCT_CORS_ORIGINS: "https://notturni.eu"

  # Cookie di sessione (refresh token httpOnly, backend/API.md).
  # NOCT_SESSION_COOKIE_SECURE="false" perché ingress.yaml, nella sua
  # versione attuale, serve solo http (nessun dominio reale/cert-manager
  # ancora configurato — vedi commento in cima a quel file): un cookie
  # Secure non verrebbe accettato dal browser su una connessione non
  # cifrata. Passare a "true" **insieme** al blocco TLS di ingress.yaml non
  # appena l'istanza è raggiunta in https, mai prima (altrimenti il login
  # smette di "restare loggato" senza errori visibili).
  NOCT_SESSION_COOKIE_SECURE: "false"
  NOCT_SESSION_COOKIE_SAMESITE: "lax"
  NOCT_SESSION_COOKIE_DOMAIN: ""

  # URL interno al cluster del backend, usato dai Server Component del
  # frontend per l'SSR (il browser usa invece l'host pubblico).
  NOCT_BACKEND_INTERNAL_URL: "http://backend:8000"
  # invalidazione on-demand della cache del frontend dopo publish/update di
  # contenuti pubblici (vedi backend/app/core/revalidation.py). Il secret
  # corrispondente è in secret.yaml (NOCT_REVALIDATE_SECRET), condiviso tra
  # backend e frontend; se assente la funzione è disattivata (solo cache a tempo).
  NOCT_FRONTEND_REVALIDATE_URL: "http://frontend:3000/api/revalidate"
