# Nessuna persistenza in questo primo draft: le code (email OTP, task asincroni)
# sono ricostruibili; da rivalutare quando arriveranno code con garanzie di consegna
# più stringenti.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: notturni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef: {name: notturni-config, key: NOCT_RABBITMQ_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: notturni-secrets, key: NOCT_RABBITMQ_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: notturni
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
