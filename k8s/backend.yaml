# image: sostituire con il riferimento al registro usato in CI/CD una volta
# disponibile (per ora punta a un'immagine costruita/caricata localmente sul nodo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: notturni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: notturni-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: notturni-config}
            - secretRef: {name: notturni-secrets}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: notturni
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
