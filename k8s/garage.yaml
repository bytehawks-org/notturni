# Object storage S3-compatible (Garage, nodo singolo). Config in garage.toml
# (kustomize configMapGenerator), segreti da notturni-secrets. L'immagine è
# `scratch` (solo il binario /garage, nessuna shell).
#
# Un Garage appena avviato non è utilizzabile: nodo senza ruolo nel layout,
# nessuna chiave, nessun bucket. Ci pensa l'initContainer `garage-bootstrap`
# di backend.yaml (legacy/backend/scripts/garage_bootstrap.py, idempotente).
#
# Le letture pubbliche (avatar, media) NON passano da qui direttamente: vedi
# s3-public.yaml (Garage non ha le bucket policy S3).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: notturni
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: notturni
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: notturni
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.4.1
          ports:
            - containerPort: 3900
            - containerPort: 3902
            - containerPort: 3903
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: notturni-secrets, key: NOCT_GARAGE_RPC_SECRET}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: notturni-secrets, key: NOCT_GARAGE_ADMIN_TOKEN}
          # tcpSocket e non httpGet /health: quel endpoint risponde 503 finché
          # il layout non è assegnato, cioè finché non gira il bootstrap, che
          # a sua volta raggiunge Garage tramite il Service (solo se Ready).
          readinessProbe:
            tcpSocket: {port: 3903}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 3900}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: meta
          persistentVolumeClaim:
            claimName: garage-meta
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: notturni
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: web
      port: 3902
      targetPort: 3902
    # admin API: solo intra-cluster, protetta da NOCT_GARAGE_ADMIN_TOKEN;
    # mai esposta da un IngressRoute
    - name: admin
      port: 3903
      targetPort: 3903
