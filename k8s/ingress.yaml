# Routing path-based verso frontend/backend, sotto l'host di produzione
# notturni.eu. Il routing per sottodominio-per-blog (slug.notturni.eu) ha
# una risorsa propria — ingressroute.yaml (IngressRoute Traefik dinamico,
# host jolly) — che convive con questa, non la sostituisce: questa resta il
# catch-all path-based. Dominio custom per-utente (CLAUDE.md #2): non
# ancora implementato, nessuna delle due risorse lo copre oggi.
#
# TLS: certificato condiviso con ingressroute.yaml (Secret notturni-eu-tls,
# provisionato dalla risorsa Certificate esplicita in certificate.yaml, non
# dall'annotazione cert-manager.io/cluster-issuer — quest'ultima
# funzionerebbe solo per questa singola risorsa Ingress, non per
# l'IngressRoute Traefik di ingressroute.yaml che condivide lo stesso
# certificato, da cui la scelta di una Certificate a sé). Storico: la
# versione precedente di questo file serviva solo http senza host fisso,
# per un primo test via IP nodo senza dominio/cert-manager ancora
# installati — coerente allora con NOCT_SESSION_COOKIE_SECURE="false" in
# configmap.yaml, ora "true" insieme a questo passaggio a TLS (i due vanno
# sempre cambiati insieme, mai uno senza l'altro).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notturni
  namespace: notturni
  annotations:
    # Security header minimi (CSP/HSTS/nosniff, CLAUDE.md #6) — Middleware
    # Traefik definito in middleware-security-headers.yaml, riusato anche da
    # ingressroute.yaml. Formato annotazione: <namespace>-<nome>@kubernetescrd.
    traefik.ingress.kubernetes.io/router.middlewares: notturni-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["notturni.eu"]
      secretName: notturni-eu-tls
  rules:
    - host: notturni.eu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
