# Primo draft: un solo host, routing path-based verso frontend/backend. Il
# routing per sottodominio-per-blog (slug.notturni.eu) ha una risorsa propria
# — ingressroute.yaml (IngressRoute Traefik dinamico, host jolly) — che
# convive con questa, non la sostituisce: questa resta il catch-all
# path-based (utile anche in sviluppo/test senza DNS wildcard configurato).
# Dominio custom per-utente (CLAUDE.md #2): non ancora implementato,
# nessuna delle due risorse lo copre oggi.
#
# Versione ATTUALE: solo http, nessun host fisso — pensata per un primo test
# su un K3s a nodo singolo senza dominio reale né cert-manager già installato
# (si accede via IP del nodo, es. `curl http://<ip-nodo>/api/v1/health`,
# senza dover configurare DNS). Coerente con
# NOCT_SESSION_COOKIE_SECURE="false" in configmap.yaml: un cookie Secure non
# verrebbe accettato dal browser su una connessione http.
#
# Per passare alla produzione (dominio reale + cert-manager già installato
# con un ClusterIssuer, es. letsencrypt-prod): aggiungere di nuovo `host:
# notturni.eu` a entrambe le regole sotto, l'annotazione
# `cert-manager.io/cluster-issuer: letsencrypt-prod` e un blocco
# `tls: [{hosts: ["notturni.eu"], secretName: notturni-eu-tls}]` — riportare
# NOCT_SESSION_COOKIE_SECURE a "true" in configmap.yaml — e vedi anche le
# note di produzione in cima a ingressroute.yaml (TLS wildcard via DNS-01,
# NOCT_CORS_ORIGIN_REGEX/NOCT_SESSION_COOKIE_DOMAIN).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notturni
  namespace: notturni
  annotations:
    # Security header minimi (CSP/HSTS/nosniff, CLAUDE.md #6) — Middleware
    # Traefik definito in middleware-security-headers.yaml, riusato anche da
    # ingressroute.yaml. Formato annotazione: <namespace>-<nome>@kubernetescrd.
    traefik.ingress.kubernetes.io/router.middlewares: notturni-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
