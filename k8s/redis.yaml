# Nessuna persistenza: Redis è usato solo per rate limiting e lock distribuiti
# (CLAUDE.md #2), non per dati che devono sopravvivere a un riavvio del pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: notturni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: notturni
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
