# Ingresso chiuso per default: i pod si parlano solo dentro il namespace; dall'esterno arrivano solo
# ai servizi pubblici (frontend, backend, s3-public) e solo dal controller Ingress (Traefik, nel
# namespace kube-system di K3s). Postgres, Redis, NATS, Garage e moderation non sono raggiungibili da fuori.
# Richiede un CNI che applichi le NetworkPolicy (K3s: controller integrato, attivo di default).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: notturni
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: notturni
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: notturni
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [frontend, backend, s3-public]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
