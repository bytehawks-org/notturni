# image: come per backend.yaml, sostituire con il riferimento al registro reale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: notturni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: notturni-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: notturni
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
