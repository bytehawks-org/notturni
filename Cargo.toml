[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
noct-manifest = { path = "crates/noct-manifest" }
noct-migrate = { path = "crates/noct-migrate", default-features = false }
noct-codegen = { path = "crates/noct-codegen" }
noct-core = { path = "crates/noct-core" }
noct-users = { path = "crates/noct-users" }
noct-blogs = { path = "crates/noct-blogs" }
noct-taxonomy = { path = "modules/taxonomy" }
noct-sandbox = { path = "modules/sandbox" }
noct-bundle = { path = "crates/noct-bundle" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
