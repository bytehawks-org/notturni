[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Binari di test più piccoli: i test end-to-end linkano l'intero workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 in un profilo non ottimizzato è 20-50 volte più lento: renderebbe lenti test e sviluppo.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Nessun codice `unsafe` nei crate del progetto: `forbid` non è aggirabile con `#[allow]`
# e vale anche per il codice generato dai manifest. (Le dipendenze esterne restano fuori
# da questa regola; vedi todo/RUST_MIGRATION.md.)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
noct-manifest = { path = "crates/noct-manifest" }
noct-migrate = { path = "crates/noct-migrate", default-features = false }
noct-codegen = { path = "crates/noct-codegen" }
noct-core = { path = "crates/noct-core" }
noct-users = { path = "crates/noct-users" }
noct-profiles = { path = "crates/noct-profiles" }
noct-blogs = { path = "crates/noct-blogs" }
noct-events = { path = "crates/noct-events" }
noct-security = { path = "crates/noct-security" }
noct-audit = { path = "crates/noct-audit" }
noct-auth = { path = "crates/noct-auth" }
noct-taxonomy = { path = "modules/taxonomy" }
noct-publications = { path = "modules/publications" }
noct-pages = { path = "modules/pages" }
noct-link-preview = { path = "modules/link_preview" }
noct-notes = { path = "modules/notes" }
noct-fragments = { path = "modules/fragments" }
noct-comments = { path = "modules/comments" }
noct-discovery = { path = "modules/discovery" }
noct-interests = { path = "modules/interests" }
noct-reports = { path = "modules/reports" }
noct-newsletter = { path = "modules/newsletter" }
noct-custom-domains = { path = "modules/custom_domains" }
noct-gdpr = { path = "modules/gdpr" }
noct-backup = { path = "modules/backup" }
noct-image-moderation = { path = "modules/image_moderation" }
noct-auth-mfa = { path = "modules/auth_mfa" }
noct-auth-sso = { path = "modules/auth_sso" }
noct-sandbox = { path = "modules/sandbox" }
noct-bundle = { path = "crates/noct-bundle" }
noct-storage = { path = "crates/noct-storage" }
noct-cache = { path = "crates/noct-cache" }
noct-bus = { path = "crates/noct-bus" }
noct-mail = { path = "crates/noct-mail" }
noct-markdown = { path = "crates/noct-markdown" }
noct-http = { path = "crates/noct-http" }
noct-platform = { path = "crates/noct-platform" }
noct-admin = { path = "crates/noct-admin" }
noct-posts = { path = "crates/noct-posts" }
noct-media = { path = "crates/noct-media" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
sha2 = "0.11"
hex = "0.4"
chacha20poly1305 = "0.10"
flate2 = "1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

async-trait = "0.1"
bytes = "1"
# immagini: decodifica/ridimensionamento (solo i formati ammessi in upload) e WebP con perdita (libwebp)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webp = { version = "0.3", default-features = false }
futures = "0.3"
tokio-util = "0.7"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
async-nats = "0.50"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "ring"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
tower-http = { version = "0.7", features = ["fs", "cors"] }
argon2 = "0.6"
hmac = "0.13"
subtle = "2"
base64 = "0.23"
getrandom = "0.4"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hickory-resolver = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
multer = "3"
