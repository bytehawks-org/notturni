[[enum]]
name = "report_target_type"
values = ["blog", "post"]

[[enum]]
name = "report_reason"
values = ["spam", "abuse", "illegal", "other"]

[[enum]]
name = "report_status"
values = ["open", "dismissed", "actioned"]

# Segnalazione di un blog o di un post. Il bersaglio non ha una chiave esterna (un post
# cancellato lascia la segnalazione leggibile dai moderatori); il blog di appartenenza sì.
[[table]]
name = "content_reports"
timestamps = true
columns = [
  { name = "id", type = "uuid", pk = true, default = "gen_random_uuid()" },
  { name = "reporter_id", type = "uuid", ref = "users.id", on_delete = "cascade" },
  { name = "target_type", type = "enum:report_target_type" },
  { name = "target_id", type = "uuid" },
  { name = "blog_id", type = "uuid", ref = "blogs.id", on_delete = "cascade" },
  { name = "reason", type = "enum:report_reason" },
  { name = "note", type = "varchar(500)", null = true },
  { name = "status", type = "enum:report_status", default = "'open'" },
  { name = "resolved_at", type = "timestamptz", null = true },
  { name = "resolved_by_id", type = "uuid", null = true, ref = "users.id", on_delete = "set_null" },
]
# una sola segnalazione per lettore e bersaglio
uniques = [{ name = "uq_content_report_per_reporter", columns = ["reporter_id", "target_type", "target_id"] }]
indexes = [{ columns = ["target_id"] }, { columns = ["blog_id"] }, { columns = ["status"] }]
