# Sincronizzazione di uno Spazio verso un repository Git remoto. Una configurazione per Spazio; la
# credenziale appartiene a chi l'ha impostata (il proprietario) ed è cifrata a riposo.
[[table]]
name = "git_sync_configs"
timestamps = true
columns = [
  { name = "id", type = "uuid", pk = true, default = "gen_random_uuid()" },
  { name = "blog_id", type = "uuid", ref = "blogs.id", on_delete = "cascade" },
  { name = "owner_id", type = "uuid", ref = "users.id", on_delete = "cascade" },
  { name = "remote_url", type = "varchar(2048)" },
  { name = "branch", type = "varchar(200)", default = "'notturni-backup'" },
  # utente per l'autenticazione HTTPS (con un token qualsiasi nome va bene per GitHub e Forgejo)
  { name = "username", type = "varchar(100)", default = "'git'" },
  # `https` (token personale) | `ssh` (chiave di deploy generata dalla piattaforma)
  { name = "auth_method", type = "varchar(8)", default = "'https'" },
  # `https`: token; `ssh`: chiave privata. In entrambi i casi cifrato (`noct_security::secrets`), mai restituito
  { name = "secret", type = "text" },
  # solo `ssh`: chiave pubblica da registrare come deploy key (con scrittura) presso il provider
  { name = "ssh_public_key", type = "text", null = true },
  # solo `ssh`: chiave dell'host rilevata alla configurazione e da lì in poi verificata (formato known_hosts),
  # con le impronte SHA256 (una per riga) mostrate all'utente per il confronto con quelle del provider
  { name = "ssh_host_key", type = "text", null = true },
  { name = "ssh_host_fingerprints", type = "text", null = true },
  { name = "include_drafts", type = "boolean", default = "false" },
  { name = "enabled", type = "boolean", default = "true" },
  # `running` | `ok` | `unchanged` | `error`
  { name = "last_status", type = "varchar(16)", null = true },
  { name = "last_run_at", type = "timestamptz", null = true },
  { name = "last_error", type = "text", null = true },
  { name = "last_commit", type = "varchar(64)", null = true },
  { name = "last_pages", type = "integer", null = true },
  # impronta dei file generati all'ultimo esito positivo: invariata = niente da fare
  { name = "last_hash", type = "varchar(64)", null = true },
]
uniques = [{ name = "uq_git_sync_blog", columns = ["blog_id"] }]
indexes = [{ columns = ["owner_id"] }]

# Impronte attese delle host key SSH dei provider noti (GitHub, GitLab...), gestite dagli amministratori. Se
# l'host di un repository è qui elencato, alla configurazione si fissano solo le chiavi rilevate la cui impronta
# coincide con una di queste; le altre vengono scartate e, se non ne resta nessuna, la configurazione è rifiutata.
# Le righe iniziali (GitHub, GitLab.com) sono inserite dalla migrazione e possono essere modificate o rimosse.
[[table]]
name = "git_sync_known_hosts"
timestamps = true
columns = [
  { name = "id", type = "uuid", pk = true, default = "gen_random_uuid()" },
  { name = "host", type = "varchar(255)" },
  { name = "port", type = "integer", default = "22" },
  # impronte `SHA256:...`, una per riga
  { name = "fingerprints", type = "text" },
  { name = "note", type = "varchar(500)", null = true },
  { name = "updated_by", type = "uuid", null = true, ref = "users.id", on_delete = "set_null" },
]
uniques = [{ name = "uq_git_sync_known_host", columns = ["host", "port"] }]
